<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GPS-тест</title>

<!-- Внешние библиотеки: карты Leaflet и Telegram Mini App -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Оформление. ?v=5 — номер версии: меняйте его (и VERSION в js/config.js) после обновлений,
     чтобы телефон не показывал старые файлы из кэша -->
<link rel="stylesheet" href="css/style.css?v=5">
</head>

<body>
<div id="app">
  <button id="routesBtn">🏁 Трассы</button>
  <button id="locate" title="Моё местоположение">📍</button>
  <div id="map"></div>

  <!-- Секундомер заезда: появляется, когда вы пересекаете линию старта трассы -->
  <div id="runBanner">
    <div id="runName"></div>
    <div id="runTime">00:00.00</div>
    <div id="runInfo"></div>
    <button id="runBtn">Отменить заезд</button>
  </div>

  <div id="panel">
    <div class="stats">
      <div class="stat"><b id="sTime">00:00</b><span>время</span></div>
      <div class="stat"><b id="sDist">0.00</b><span>км</span></div>
      <div class="stat"><b id="sSpeed">0</b><span>км/ч сейчас</span></div>
      <div class="stat"><b id="sAvg">0</b><span>км/ч средняя</span></div>
      <div class="stat"><b id="sMax">0</b><span>км/ч макс.</span></div>
      <div class="stat"><b id="sGap">0</b><span>макс. пауза, с</span></div>
    </div>
    <button id="btn">▶ Начать запись</button>
    <button id="saveBtn">💾 Сохранить как трассу</button>
    <div id="status">Определяю ваше местоположение… Разрешите доступ к геолокации.</div>
  </div>
</div>

<!-- Окно со списком трасс -->
<div id="routesOverlay">
  <div class="ov-head">
    <h2>🏁 Трассы</h2>
    <button class="ov-close" id="routesClose">✕</button>
  </div>
  <div id="routesList"></div>
</div>

<!-- Окно сохранения новой трассы -->
<div id="saveDialog">
  <div class="dlg">
    <h3>Новая трасса</h3>
    <p id="saveInfo"></p>
    <input id="routeName" type="text" maxlength="40" placeholder="Название трассы">
    <div class="row">
      <button class="cancel" id="saveCancel">Отмена</button>
      <button id="saveOk">Сохранить</button>
    </div>
  </div>
</div>

<!-- Код приложения. Порядок важен: каждый файл использует те, что выше. -->
<script src="js/config.js?v=5"></script>   <!-- настройки -->
<script src="js/utils.js?v=5"></script>    <!-- общие помощники -->
<script src="js/map.js?v=5"></script>      <!-- карта -->
<script src="js/ui.js?v=5"></script>       <!-- нижняя панель -->
<script src="js/api.js?v=5"></script>      <!-- хранение данных (трассы, рекорды) -->
<script src="js/gps.js?v=5"></script>      <!-- GPS и запись трека -->
<script src="js/snap.js?v=5"></script>     <!-- привязка к дорогам -->
<script src="js/routes.js?v=5"></script>   <!-- окно «Трассы» -->
<script src="js/run.js?v=5"></script>      <!-- заезд: старт, секундомер, финиш -->
<script src="js/app.js?v=5"></script>      <!-- запуск и кнопки -->
</body>
</html>
