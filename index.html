<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GPS-тест</title>

<!-- Библиотека карт Leaflet (бесплатная) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Библиотека Telegram Mini App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  /* Цвета берутся из темы Telegram, поэтому приложение выглядит "родным" */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #888888);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f1f1f1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100%; position: relative; }
  #map { flex: 1; min-height: 0; }
  #panel {
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--card);
  }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .stat { background: var(--bg); border-radius: 10px; padding: 6px 8px; text-align: center; }
  .stat b { display: block; font-size: 18px; }
  .stat span { font-size: 11px; color: var(--hint); }
  button {
    width: 100%; border: 0; border-radius: 12px; padding: 14px;
    font-size: 16px; font-weight: 600;
    background: var(--btn); color: var(--btn-text);
  }
  button.stop { background: #d33; color: #fff; }
  #status { font-size: 12px; color: var(--hint); margin-top: 6px; min-height: 16px; white-space: pre-line; }
  /* Кнопки поверх карты */
  #routesBtn, #locate {
    position: absolute; right: 12px; z-index: 1000; width: auto;
    background: var(--bg); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  #routesBtn { top: 12px; padding: 10px 16px; font-size: 15px; border-radius: 22px; }
  #locate { top: 62px; width: 44px; height: 44px; padding: 0; font-size: 20px; border-radius: 50%; }
  #saveBtn { display: none; margin-top: 8px; background: #1a9e4b; color: #fff; }

  /* Окно «Трассы» */
  #routesOverlay {
    display: none; position: fixed; inset: 0; z-index: 3000;
    flex-direction: column; background: var(--bg); color: var(--text);
  }
  #routesOverlay.open { display: flex; }
  .ov-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--card);
  }
  .ov-head h2 { margin: 0; font-size: 20px; }
  .ov-close { width: auto; padding: 6px 12px; font-size: 18px; background: var(--card); color: var(--text); }
  #routesList { flex: 1; overflow-y: auto; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
  .route-card { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .route-card .name { font-size: 17px; font-weight: 700; }
  .route-card .meta { font-size: 14px; margin-top: 4px; }
  .route-card .rec { font-size: 13px; color: var(--hint); margin-top: 2px; }
  .route-card .acts { display: flex; gap: 8px; margin-top: 10px; }
  .route-card .acts button { padding: 8px; font-size: 14px; border-radius: 10px; }
  .route-card .acts .del { background: transparent; color: #d33; border: 1px solid #d33; }
  .empty { color: var(--hint); text-align: center; padding: 40px 10px; line-height: 1.5; }

  /* Окно сохранения трассы */
  #saveDialog {
    display: none; position: fixed; inset: 0; z-index: 4000;
    background: rgba(0,0,0,.55); align-items: center; justify-content: center; padding: 20px;
  }
  #saveDialog.open { display: flex; }
  .dlg { background: var(--bg); color: var(--text); border-radius: 16px; padding: 18px; width: 100%; max-width: 360px; }
  .dlg h3 { margin: 0 0 6px; }
  .dlg p { margin: 0 0 12px; font-size: 13px; color: var(--hint); white-space: pre-line; }
  .dlg input {
    width: 100%; padding: 12px; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--hint); background: var(--card); color: var(--text); margin-bottom: 12px;
  }
  .dlg .row { display: flex; gap: 8px; }
  .dlg .row button { padding: 12px; }
  .dlg .cancel { background: var(--card); color: var(--text); }
</style>
</head>

<body>
<div id="app">
  <button id="routesBtn">🏁 Трассы</button>
  <button id="locate" title="Моё местоположение">📍</button>
  <div id="map"></div>

  <div id="panel">
    <div class="stats">
      <div class="stat"><b id="sTime">00:00</b><span>время</span></div>
      <div class="stat"><b id="sDist">0.00</b><span>км</span></div>
      <div class="stat"><b id="sSpeed">0</b><span>км/ч сейчас</span></div>
      <div class="stat"><b id="sAvg">0</b><span>км/ч средняя</span></div>
      <div class="stat"><b id="sMax">0</b><span>км/ч макс.</span></div>
      <div class="stat"><b id="sGap">0</b><span>макс. пауза, с</span></div>
    </div>
    <button id="btn">▶ Начать запись</button>
    <button id="saveBtn">💾 Сохранить как трассу</button>
    <div id="status">Определяю ваше местоположение… Разрешите доступ к геолокации.</div>
  </div>
</div>

<!-- Окно со списком трасс -->
<div id="routesOverlay">
  <div class="ov-head">
    <h2>🏁 Трассы</h2>
    <button class="ov-close" id="routesClose">✕</button>
  </div>
  <div id="routesList"></div>
</div>

<!-- Окно сохранения новой трассы -->
<div id="saveDialog">
  <div class="dlg">
    <h3>Новая трасса</h3>
    <p id="saveInfo"></p>
    <input id="routeName" type="text" maxlength="40" placeholder="Название трассы">
    <div class="row">
      <button class="cancel" id="saveCancel">Отмена</button>
      <button id="saveOk">Сохранить</button>
    </div>
  </div>
</div>

<script>
// ---------- Подключение к Telegram ----------
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();    // сообщаем Telegram, что приложение загрузилось
  tg.expand();   // раскрываем на весь экран
  try { tg.disableVerticalSwipes(); } catch (e) {} // чтобы свайп не закрывал приложение
}

// ---------- Настройки фильтрации GPS ----------
const MAX_ACCURACY_M = 30;       // точки с погрешностью больше 30 м отбрасываем
const MAX_SPEED_MS = 70;         // выше ~250 км/ч считаем GPS-скачком
const MAX_ACCEL = 10;            // максимальное ускорение, м/с² (~1g): резче не бывает
const STANDING_SPEED_MS = 0.5;   // медленнее — считаем, что стоим (шум GPS)
const GAP_BREAK_S = 10;          // пауза дольше 10 с разрывает линию (не соединяем «через пустоту»)
const MIN_POINTS_FOR_MAX = 5;    // максимальную скорость считаем только после 5 хороших точек

// ---------- Привязка к дорогам (OSRM, профиль «авто») ----------
const OSRM_URL = 'https://router.project-osrm.org/match/v1/driving/';
const SNAP_RADIUS_M = 30;        // на сколько метров от точки искать дорогу
const OSRM_MAX_POINTS = 100;     // лимит публичного сервера на один запрос

// ---------- Карта ----------
const map = L.map('map', { zoomControl: false }).setView([50, 20], 3);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap'
}).addTo(map);
const me = L.circleMarker([0, 0], { radius: 8, color: '#fff', weight: 3, fillColor: '#2481cc', fillOpacity: 1 });
const accCircle = L.circle([0, 0], { radius: 0, weight: 1, color: '#2481cc', fillOpacity: 0.12 });
const line = L.polyline([], { weight: 5, color: '#e5322d' }).addTo(map);   // «сырой» GPS-трек
const snapLayer = L.layerGroup().addTo(map);                                // трек по дорогам
let firstFix = true;
let lastPos = null; // последнее известное положение (для кнопки «Моё место»)

// ---------- Состояние записи ----------
let rec = false;
let watchId = null;
let wakeLock = null;
let timerId = null;
let summary = '';
let snapGeoms = [];  // участки трека, привязанные к дорогам (списки [lon, lat])
let snapTotal = 0;   // длина привязанного трека, метры
let s; // сюда кладём данные текущей записи

function resetState() {
  s = {
    startT: Date.now(),
    last: null,        // последняя принятая точка
    segs: [[]],        // трек делится на части: при потере сигнала начинается новая часть
    distance: 0,       // метры
    maxSpeed: 0,       // м/с
    maxGap: 0,         // секунды между принятыми точками
    speedNow: 0,       // м/с (сглаженная)
    points: 0,
    rejected: 0,
    breaks: 0,         // сколько раз линия разрывалась
    hiddenCount: 0,    // сколько раз приложение сворачивали
    stopT: null
  };
  line.setLatLngs([]);
  line.setStyle({ opacity: 1, dashArray: null });
  snapLayer.clearLayers();
}
resetState();

// ---------- Вспомогательные функции ----------
const $ = id => document.getElementById(id);
const kmh = ms => ms * 3.6;

// Расстояние между двумя точками на Земле (формула гаверсинусов), в метрах
function haversine(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const x = Math.sin(dLat / 2) ** 2 +
            Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

function fmtTime(ms) {
  const t = Math.floor(ms / 1000);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
  const mm = String(m).padStart(2, '0'), ss = String(sec).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

function setStatus(text) { $('status').textContent = text; }

function render() {
  const end = s.stopT || Date.now();
  const elapsed = end - s.startT;
  const avg = elapsed > 0 ? s.distance / (elapsed / 1000) : 0;
  $('sTime').textContent = fmtTime(elapsed);
  $('sDist').textContent = (s.distance / 1000).toFixed(2);
  $('sSpeed').textContent = Math.round(kmh(s.speedNow));
  $('sAvg').textContent = Math.round(kmh(avg));
  $('sMax').textContent = Math.round(kmh(s.maxSpeed));
  $('sGap').textContent = Math.round(s.maxGap);
}

// Перерисовываем линию: каждая часть трека — отдельная линия, между частями НЕТ соединения
function drawTrack() {
  line.setLatLngs(s.segs.map(seg => seg.map(p => [p.lat, p.lon])));
}

// ---------- Получение позиции ----------
function onPosition(pos) {
  const c = pos.coords;
  const p = { lat: c.latitude, lon: c.longitude, t: pos.timestamp, acc: c.accuracy };

  // Показываем текущее положение на карте
  me.setLatLng([p.lat, p.lon]);
  accCircle.setLatLng([p.lat, p.lon]).setRadius(p.acc);
  if (!map.hasLayer(me)) { accCircle.addTo(map); me.addTo(map); }
  lastPos = p;
  if (firstFix) { map.setView([p.lat, p.lon], 16); firstFix = false; }

  // Пока запись не идёт, просто показываем, где мы находимся
  if (!rec) {
    if (!s.stopT) setStatus(`Ваше местоположение определено (±${Math.round(p.acc)} м).\nНажмите «Начать запись».`);
    return;
  }

  // 1) Отбрасываем неточные точки
  if (p.acc > MAX_ACCURACY_M) { s.rejected++; return; }

  // Первая точка записи
  if (!s.last) {
    s.last = p; s.segs[0].push(p); s.points++;
    drawTrack();
    return;
  }

  const dt = (p.t - s.last.t) / 1000;
  if (dt <= 0) return;

  // 2) Длинная пауза (свернули приложение, пропал сигнал): начинаем новую часть линии.
  //    Расстояние за время паузы НЕ добавляем и точки не соединяем прямой линией.
  if (dt > GAP_BREAK_S) {
    s.maxGap = Math.max(s.maxGap, dt);
    s.breaks++;
    s.segs.push([p]);
    s.last = p;
    s.speedNow = 0;
    s.points++;
    drawTrack();
    map.panTo([p.lat, p.lon], { animate: true });
    render();
    setStatus(`Был разрыв записи на ${Math.round(dt)} с, линия начата заново.\nТочек: ${s.points} · разрывов: ${s.breaks}`);
    return;
  }

  const d = haversine(s.last, p);
  const v = d / dt;

  // 3) Отбрасываем нереальные скачки: слишком быстро или слишком резкое ускорение
  if (v > MAX_SPEED_MS || Math.abs(v - s.speedNow) > MAX_ACCEL * dt + 3) {
    s.rejected++;
    return;
  }

  s.maxGap = Math.max(s.maxGap, dt);

  // 4) Расстояние добавляем, только если действительно движемся
  if (v >= STANDING_SPEED_MS) s.distance += d;

  // 5) Скорость: берём от GPS, только если она согласуется с нашим расчётом; иначе считаем сами
  let sp = (c.speed != null && c.speed >= 0 && Math.abs(c.speed - v) < 4) ? c.speed : v;
  if (v < STANDING_SPEED_MS) sp = 0;
  s.speedNow = s.speedNow * 0.5 + sp * 0.5;   // небольшое сглаживание
  if (s.points >= MIN_POINTS_FOR_MAX) s.maxSpeed = Math.max(s.maxSpeed, s.speedNow);

  s.last = p;
  s.segs[s.segs.length - 1].push(p);
  s.points++;
  drawTrack();
  map.panTo([p.lat, p.lon], { animate: true });
  render();
  setStatus(`Точек: ${s.points} · точность ±${Math.round(p.acc)} м · отброшено: ${s.rejected}\n` +
            `Сворачивали приложение: ${s.hiddenCount} раз · разрывов: ${s.breaks}`);
}

function onError(err) {
  // Если доступ запретили, снимаем слежение, чтобы при старте записи попробовать снова
  if (err.code === 1 && watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  const texts = {
    1: 'Доступ к геолокации запрещён. Разрешите его в настройках Telegram / телефона.',
    2: 'Не удалось определить положение (нет сигнала GPS).',
    3: 'Время ожидания геолокации истекло.'
  };
  setStatus(texts[err.code] || ('Ошибка геолокации: ' + err.message));
}

// Просим у Telegram доступ к геолокации (новые версии Telegram)
function askTelegramLocation() {
  return new Promise(resolve => {
    const done = () => resolve();
    try {
      const lm = tg && tg.LocationManager;
      if (!lm) return done();
      setTimeout(done, 15000); // страховка, чтобы не зависнуть
      lm.init(() => {
        if (lm.isLocationAvailable && !lm.isAccessGranted) {
          lm.getLocation(() => done()); // вызывает окно с запросом разрешения
        } else {
          done();
        }
      });
    } catch (e) { done(); }
  });
}

// Не даём экрану погаснуть во время записи
async function keepScreenOn() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) {}
}

// Запускаем слежение за положением (работает и без записи, чтобы показывать вас на карте)
async function startWatching() {
  if (watchId !== null) return;
  await askTelegramLocation();
  if (!('geolocation' in navigator)) { setStatus('Геолокация недоступна на этом устройстве.'); return; }
  watchId = navigator.geolocation.watchPosition(onPosition, onError, {
    enableHighAccuracy: true, maximumAge: 0, timeout: 20000
  });
}

// ---------- Привязка трека к дорогам ----------
// Выбираем не больше max точек, равномерно по треку (первая и последняя сохраняются)
function thin(points, max) {
  if (points.length <= max) return points;
  const out = [];
  for (let i = 0; i < max; i++) out.push(points[Math.round(i * (points.length - 1) / (max - 1))]);
  return out;
}

// Отправляем каждую часть трека в OSRM: он находит, по каким автодорогам вы ехали.
// Профиль «driving» не использует тротуары и пешеходные дорожки.
async function snapToRoads() {
  const parts = s.segs.filter(seg => seg.length >= 2);
  if (!parts.length) { setStatus(summary + '\nТрек слишком короткий для привязки к дорогам.'); return; }

  setStatus(summary + '\nПривязываю маршрут к дорогам…');
  let total = 0, matched = 0, failed = 0;

  for (const seg of parts) {
    const pts = thin(seg, OSRM_MAX_POINTS);
    const coords = pts.map(p => p.lon.toFixed(6) + ',' + p.lat.toFixed(6)).join(';');
    const radiuses = pts.map(() => SNAP_RADIUS_M).join(';');
    const url = `${OSRM_URL}${coords}?overview=full&geometries=geojson&radiuses=${radiuses}&tidy=true`;
    try {
      const resp = await fetch(url);
      const data = await resp.json();
      if (data.code === 'Ok' && data.matchings && data.matchings.length) {
        for (const m of data.matchings) {
          L.geoJSON(m.geometry, { style: { color: '#1a9e4b', weight: 6, opacity: 0.95 } }).addTo(snapLayer);
          total += m.distance;
          snapGeoms.push(m.geometry.coordinates);
          matched++;
        }
      } else {
        failed++;
      }
    } catch (e) {
      failed++;
    }
  }

  if (matched) {
    snapTotal = total;
    line.setStyle({ opacity: 0.35, dashArray: '4 8' });  // «сырой» трек делаем бледным пунктиром
    setStatus(summary + `\nПо дорогам (зелёная линия): ${(total / 1000).toFixed(2)} км · участков: ${matched}` +
              (failed ? `\nНе удалось привязать частей: ${failed}` : ''));
  } else {
    setStatus(summary + '\nНе удалось привязать к дорогам (нет сети или рядом нет автодорог). Показан исходный трек.');
  }
}

// ---------- Старт / стоп ----------
async function start() {
  resetState();
  snapGeoms = [];
  snapTotal = 0;
  $('saveBtn').style.display = 'none';
  rec = true;
  $('btn').textContent = '■ Остановить';
  $('btn').classList.add('stop');
  setStatus('Запрашиваю доступ к геолокации…');

  await startWatching(); // если слежение ещё не запущено (например, раньше не дали доступ)

  s.startT = Date.now();
  keepScreenOn();
  timerId = setInterval(render, 1000);
  setStatus(lastPos ? 'Запись идёт…' : 'Ищу GPS-сигнал…');
}

function stop() {
  rec = false;
  s.stopT = Date.now();
  clearInterval(timerId); // слежение за положением не выключаем: вы остаётесь на карте
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  $('btn').textContent = '▶ Начать запись заново';
  $('btn').classList.remove('stop');
  render();
  summary = `Запись завершена.\nТочек: ${s.points} · макс. пауза: ${Math.round(s.maxGap)} с · разрывов: ${s.breaks}\n` +
            `Сворачивали приложение: ${s.hiddenCount} раз`;
  setStatus(summary);
  // Когда привязка к дорогам закончилась, предлагаем сохранить трек как трассу
  snapToRoads().then(() => {
    if (!rec && s.points >= 2) $('saveBtn').style.display = 'block';
  });
}

$('btn').addEventListener('click', () => rec ? stop() : start());

// Кнопка «Моё место»: возвращает карту к вашему положению
$('locate').addEventListener('click', () => {
  if (lastPos) map.setView([lastPos.lat, lastPos.lon], Math.max(map.getZoom(), 16));
  else startWatching();
});

// Считаем сворачивания (чтобы понять, как Telegram ведёт себя в фоне)
document.addEventListener('visibilitychange', () => {
  if (!rec) return;
  if (document.hidden) {
    s.hiddenCount++;
  } else {
    keepScreenOn(); // экран снова включили — повторно запрашиваем блокировку
  }
});

// ====================== ТРАССЫ ======================
// Пока трассы хранятся в памяти телефона (localStorage). Позже перенесём на сервер,
// чтобы их видели все пользователи и рекорды были общими.
const STORE_KEY = 'strace_routes_v1';
const routeLayer = L.layerGroup().addTo(map);   // выбранная трасса на карте
let routes = loadRoutes();

function loadRoutes() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch (e) { return []; }
}
function storeRoutes() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(routes)); return true; } catch (e) { return false; }
}

const fmtKm = m => (m / 1000).toFixed(2) + ' км';
const fmtDate = ts => new Date(ts).toLocaleDateString('ru-RU');

// --- Окно со списком трасс ---
function openRoutes() {
  renderRoutes();
  $('routesOverlay').classList.add('open');
  try { tg.BackButton.show(); tg.BackButton.onClick(closeRoutes); } catch (e) {}
}
function closeRoutes() {
  $('routesOverlay').classList.remove('open');
  try { tg.BackButton.offClick(closeRoutes); tg.BackButton.hide(); } catch (e) {}
}

function renderRoutes() {
  const box = $('routesList');
  box.textContent = '';

  if (!routes.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'Трасс пока нет.\nЗапишите заезд кнопкой «Начать запись», затем нажмите ' +
                    '«Сохранить как трассу»: она появится здесь вместе с первым рекордом.';
    e.style.whiteSpace = 'pre-line';
    box.appendChild(e);
    return;
  }

  routes.forEach(r => {
    const card = document.createElement('div');
    card.className = 'route-card';

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = r.name;

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = '📏 ' + fmtKm(r.distance);

    const rec = document.createElement('div');
    rec.className = 'rec';
    rec.textContent = r.record
      ? `🏆 Рекорд: ${fmtTime(r.record.time * 1000)} · ${Math.round(r.record.avgKmh)} км/ч средняя · ${fmtDate(r.record.date)}`
      : '🏆 Рекорда пока нет';

    const acts = document.createElement('div');
    acts.className = 'acts';
    const show = document.createElement('button');
    show.textContent = 'Показать на карте';
    show.onclick = () => showRoute(r);
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = 'Удалить';
    del.onclick = () => deleteRoute(r);
    acts.append(show, del);

    card.append(name, meta, rec, acts);
    box.appendChild(card);
  });
}

function showRoute(r) {
  routeLayer.clearLayers();
  const all = [];
  r.lines.forEach(l => {
    L.polyline(l, { color: '#7b3fe4', weight: 7, opacity: 0.9 }).addTo(routeLayer);
    all.push(...l);
  });
  if (all.length) {
    L.circleMarker(all[0], { radius: 9, color: '#fff', weight: 3, fillColor: '#1a9e4b', fillOpacity: 1 })
      .bindTooltip('Старт').addTo(routeLayer);
    L.circleMarker(all[all.length - 1], { radius: 9, color: '#fff', weight: 3, fillColor: '#111', fillOpacity: 1 })
      .bindTooltip('Финиш').addTo(routeLayer);
    map.fitBounds(L.latLngBounds(all), { padding: [40, 40] });
  }
  closeRoutes();
  setStatus(`Трасса «${r.name}» · ${fmtKm(r.distance)}`);
}

function deleteRoute(r) {
  const doDelete = () => {
    routes = routes.filter(x => x.id !== r.id);
    storeRoutes();
    routeLayer.clearLayers();
    renderRoutes();
  };
  const text = `Удалить трассу «${r.name}»?`;
  if (tg && tg.showConfirm) {
    try { return tg.showConfirm(text, ok => ok && doDelete()); } catch (e) {}
  }
  if (confirm(text)) doDelete();
}

// --- Сохранение записанного трека как трассы ---
function openSaveDialog() {
  const dist = snapGeoms.length ? snapTotal : s.distance;
  const secs = Math.round((s.stopT - s.startT) / 1000);
  const valid = s.breaks === 0;
  $('saveInfo').textContent =
    `Длина: ${fmtKm(dist)} · время: ${fmtTime(secs * 1000)}\n` +
    (snapGeoms.length ? 'Трасса будет сохранена по дорогам.' : 'Привязки к дорогам нет, сохранится исходный GPS-трек.') +
    (valid ? '\nЭто время станет первым рекордом.' : '\nВ записи были разрывы, поэтому рекорд не засчитывается.');
  $('routeName').value = 'Трасса ' + (routes.length + 1);
  $('saveDialog').classList.add('open');
}

function saveRoute() {
  const name = $('routeName').value.trim() || ('Трасса ' + (routes.length + 1));
  const secs = Math.round((s.stopT - s.startT) / 1000);
  const dist = snapGeoms.length ? snapTotal : s.distance;

  // Геометрия: по дорогам, если привязка удалась; иначе сам GPS-трек (не более 400 точек на участок)
  const lines = snapGeoms.length
    ? snapGeoms.map(g => thin(g, 400).map(c => [c[1], c[0]]))   // OSRM отдаёт [lon, lat], Leaflet хочет [lat, lon]
    : s.segs.filter(seg => seg.length >= 2).map(seg => thin(seg, 400).map(p => [p.lat, p.lon]));

  const route = {
    id: Date.now(),
    name,
    distance: dist,
    snapped: snapGeoms.length > 0,
    lines,
    record: (s.breaks === 0 && secs > 0)
      ? { time: secs, avgKmh: (dist / secs) * 3.6, date: Date.now() }
      : null
  };
  routes.push(route);

  $('saveDialog').classList.remove('open');
  $('saveBtn').style.display = 'none';
  if (storeRoutes()) {
    setStatus(`Трасса «${name}» сохранена. Откройте «🏁 Трассы», чтобы увидеть её.`);
  } else {
    setStatus('Не удалось сохранить трассу в память телефона (хранилище недоступно).');
  }
}

$('routesBtn').addEventListener('click', openRoutes);
$('routesClose').addEventListener('click', closeRoutes);
$('saveBtn').addEventListener('click', openSaveDialog);
$('saveCancel').addEventListener('click', () => $('saveDialog').classList.remove('open'));
$('saveOk').addEventListener('click', saveRoute);

// Сразу при открытии определяем местоположение
startWatching();
</script>
</body>
</html>
